[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "smb_native"
version = "0.1.0"
description = "Python wrapper for smb_native C++ library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["scikit-build-core>=0.11", "nanobind>=2.0"] # for editable installs with --no-build-isolation

[tool.scikit-build]
wheel.packages = ["python/smb_native"]
build-dir = "build/skbuild" # caches the build between installs
sdist.exclude = ["assets/*.nes", "include/smb/data/game_data.hpp"]
cmake.define = { BUILD_PYTHON_BINDINGS = "ON", BUILD_CPP_LIBRARY = "OFF" }